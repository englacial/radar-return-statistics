opr:
  cache_dir: "./radar_cache/"

region:
  area: "greenland"

query:
  collections:
    # 2012_Greenland_P3 and earlier broadly lack the 'Heading' variable that
    # xopr turn-rejection QC requires, so they yield zero usable frames.
    - "2013_Greenland_P3"
    - "2014_Greenland_P3"
    - "2016_Greenland_P3"
    - "2017_Greenland_P3"
    - "2018_Greenland_P3"
    - "2019_Greenland_P3"
  max_items: null

processing:
  data_product: "CSARP_standard"
  decimate_interval: "10s"
  layer_margin_m: 50
  ice_permittivity: 3.17
  max_workers: 8
  checkpoint_every: 200
  noise:
    pre_surface:
      start_offset_us: 1.0
      end_offset_us: 1.0
    post_bed:
      start_offset_us: 5.0
      end_offset_us: 5.0
    # Window measured back from the record end; the 7 us end gap blanks the
    # post-processing rolloff (see claude_notes/tail_window_sensitivity_results.md)
    record_tail:
      start_offset_us: 12.0
      end_offset_us: 7.0

qc:
  max_heading_change_deg_per_km: 2.0
  min_ice_thickness_m: null
  min_agl_m: 50
  min_bed_snr_db: null
  min_traces_after_qc: 15

store:
  backend: "s3"
  s3_bucket: "opr-radar-metrics"
  s3_prefix: "icechunk/greenland"
  s3_region: "us-west-2"
  remove_out_of_scope: false
